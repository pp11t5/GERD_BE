services:
  # PostgreSQL local verification DB
  # JDBC: jdbc:postgresql://localhost:5432/gerd
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gerd
      POSTGRES_USER: gerd
      POSTGRES_PASSWORD: gerd
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── APM: Grafana + Prometheus (OTLP 수신 올인원) ──────────────
  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["apm", "loadtest"]
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      TZ: Asia/Seoul
    restart: unless-stopped

  # ── k6 부하 생성기 (on-demand) ────────────────────────────────
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
      TOKEN: ${TOKEN:-}
    volumes:
      - ./load-tests:/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
