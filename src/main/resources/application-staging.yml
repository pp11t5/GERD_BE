spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require&TimeZone=Asia/Seoul
    driver-class-name: org.postgresql.Driver
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON}
  project-id: ${FIREBASE_PROJECT_ID}

notification:
  scheduler:
    enabled: false

withdraw:
  # staging은 스케줄러 대신 완전 탈퇴 엔드포인트(DELETE /api/v1/auth/withdraw/hard)로 검증
  # → 스케줄러 off, 유예기간은 prod와 동일(base 14d 상속)
  scheduler:
    enabled: ${WITHDRAW_SCHEDULER_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:259200000}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: staging
  release: ${SENTRY_RELEASE:${RAILWAY_GIT_COMMIT_SHA:unknown}}
  exception-resolver-order: -2147483647
  max-request-body-size: always
  send-default-pii: false
  traces-sample-rate: 0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    diskspace:
      enabled: true
    ping:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${BETTERSTACK_OTLP_URL}/v1/metrics
        headers:
          Authorization: Bearer ${BETTERSTACK_SOURCE_TOKEN}
        step: 30s
logging:
  level:
    io.micrometer.registry.otlp: TRACE
