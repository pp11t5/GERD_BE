server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: gerd
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    # 기존 스키마는 ddl-auto가 관리 — Flyway는 그 위에 얹는 확장/인덱스/데이터 마이그레이션만 담당
    baseline-on-migrate: true
    baseline-version: "0"
    # CREATE INDEX CONCURRENTLY(V1)처럼 트랜잭션 밖에서 실행돼야 하는 구문을 한 마이그레이션에 섞어 쓰기 위함
    mixed: true
    # 배포 중 이전 인스턴스가 advisory lock을 잠깐 보유해도 실패하지 않도록 재시도 횟수를 늘림
    lock-retry-count: 50

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-characters-long}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:259200000}

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  project-id: ${FIREBASE_PROJECT_ID:}

notification:
  scheduler:
    enabled: false
  post-meal:
    delay: ${POST_MEAL_NOTIFICATION_DELAY:PT2H}
    quiet-hours-start: ${POST_MEAL_NOTIFICATION_QUIET_HOURS_START:22:00}
    deferred-time: ${POST_MEAL_NOTIFICATION_DEFERRED_TIME:09:00}
    cooldown: ${POST_MEAL_NOTIFICATION_COOLDOWN:PT90M}

report:
  weekly:
    generation-cron: "${WEEKLY_REPORT_GENERATION_CRON:0 0 10 * * MON}"
    notification-cron: "${WEEKLY_REPORT_NOTIFICATION_CRON:-}"

withdraw:
  scheduler:
    # 물리 삭제 스케줄러 — local/dev에서 실수로 삭제되지 않도록 기본 off, staging/prod에서만 on
    enabled: ${WITHDRAW_SCHEDULER_ENABLED:false}

auth:
  provider-token-encryption-key: ${AUTH_PROVIDER_TOKEN_ENCRYPTION_KEY:}

kakao:
  native-app-key: ${KAKAO_NATIVE_APP_KEY:}
  iss: ${KAKAO_ISS:}
  jwks-url: ${KAKAO_JWKS_URL:}
  admin-key: ${KAKAO_ADMIN_KEY:}

apple:
  iss: ${APPLE_ISS:https://appleid.apple.com}
  jwks-url: ${APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}
  client-id: ${APPLE_CLIENT_ID:}
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key: ${APPLE_PRIVATE_KEY:}
  token-url: ${APPLE_TOKEN_URL:https://appleid.apple.com/auth/token}
  revoke-url: ${APPLE_REVOKE_URL:https://appleid.apple.com/auth/revoke}

google:
  iss: ${GOOGLE_ISS:https://accounts.google.com}
  jwks-url: ${GOOGLE_JWKS_URL:https://www.googleapis.com/oauth2/v3/certs}
  web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  android-client-id: ${GOOGLE_ANDROID_CLIENT_ID:}
  ios-client-id: ${GOOGLE_IOS_CLIENT_ID:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:3000}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:15000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
    instances:
      gemini-judgment:
        slow-call-duration-threshold: 2s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
    instances:
      gemini-judgment:
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.web.client.HttpClientErrorException$BadRequest
          - org.springframework.web.client.HttpClientErrorException$Unauthorized
          - org.springframework.web.client.HttpClientErrorException$Forbidden

sentry:
  dsn: ${SENTRY_DSN:}
  exception-resolver-order: -2147483647
  max-request-body-size: always
  send-default-pii: false
  traces-sample-rate: 0.0

admin:
  email: ${ADMIN_EMAIL:}
  secret: ${ADMIN_SECRET:}

swagger:
  username: ${SWAGGER_USERNAME:admin}
  password: ${SWAGGER_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
