spring:
  # Testcontainers가 jdbc:tc 드라이버로 PostgreSQL 컨테이너를 자동 기동/공유한다 (JVM당 1개)
  datasource:
    url: jdbc:tc:postgresql:16:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  # 매번 새로 뜨는 Testcontainers DB엔 ddl-auto가 스키마를 만들기 전이라
  # Flyway가 foods 등 테이블을 참조하는 마이그레이션에서 실패 — 테스트에서는 비활성화
  flyway:
    enabled: false
  # @DataJpaTest가 임베디드 H2로 대체하지 않고 위 datasource를 그대로 쓰게 한다
  test:
    database:
      replace: none

app:
  withdraw:
    grace-period: PT10M
    schedule-in-memory: true

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXMhIQ==
  access-expiration-ms: 3600000
  refresh-expiration-ms: 259200000

r2:
  credentials:
    access-key: test-access-key
    secret-key: test-secret-key
  endpoint: https://test.r2.local
  bucket: test-bucket

sentry:
  dsn:
  exception-resolver-order: -2147483647
  max-request-body-size: always
  send-default-pii: false
  traces-sample-rate: 0.0

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      gemini-judgment:          # 슬라이딩 윈도우 3회 모두 실패 시 OPEN — 빠른 테스트용
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 1
  retry:
    instances:
      gemini-judgment:          # call() 1회 = gemini 1회 호출 전제인 CB 테스트 호출 횟수 검증 보존
        max-attempts: 1
